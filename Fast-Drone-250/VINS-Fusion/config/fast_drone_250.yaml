%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2


imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/infra1/image_rect_raw"
image1_topic: "/camera/infra2/image_rect_raw"




output_path: "/tmp/vins_output"


cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480
   

# Extrinsic parameter between IMU and Camera.

estimate_extrinsic: 1

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.00321371, -0.01084353,  0.99993604,  5.0565592201665305e-02,
           -0.99996254,  0.00807174, -0.00312626, 2.1124785844035578e-02,
           -0.00803732, -0.99990863, -0.01086906,  3.9024775279465504e-02,
            0.0,         0.0,         0.0,         1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.00321371, -0.01084353,  0.99993604, 5.0114710469528974e-02,
           -0.99996254,  0.00807174, -0.00312626, -2.9537884753658383e-02,
           -0.00803732, -0.99990863, -0.01086906, 3.8897111872464522e-02,
            0.0,         0.0,         0.0,         1.0 ]
 
multiple_thread: 1

#feature traker paprameters
max_cnt: 150     # max featur  e number in feature tracking
min_dist: 30            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

# Backend observation selector.
# 0 = off/original, 1 = log only, 2 = gate visual factors after initialization warmup.
backend_selector_mode: 1
backend_selector_warmup_frames: 10
backend_landmark_budget: 100      # legacy; conservative compression mode does not drop whole landmarks
backend_max_obs_per_feature: 4
backend_selector_min_total_obs: 500
backend_selector_min_track_len: 8
z_drift_state_log_enable: 1
# Frontend new-feature distribution. Existing tracked features are never removed by this block.
frontend_grid_feature_enable: 0
frontend_grid_cols: 12
frontend_grid_rows: 8
frontend_grid_max_per_cell: 2
frontend_grid_quality: 0.05
frontend_fb_threshold: 0.5
# Absolute Shi-Tomasi response floor. 0 = off (response-ordered budget only).
# Raise to reject globally-weak corners instead of forcing cells to fill.
frontend_min_eig: 0.0
# Read-only low-texture warning threshold on grid coverage ratio [0..1].
# Below this, the debug image shows LOW-TEX and the run logs a throttled WARN.
# It does NOT fabricate points; the estimator leans on the IMU. 0 = off.
frontend_low_tex_coverage: 0.35
backend_feature_fate_sidecar_log_enable: 0
backend_feature_observability_sidecar_log_enable: 1

#optimization parameters
max_solver_time: 0.04 # max solver itration time (ms), to guarantee real time
max_num_iterations: 8  # max solver itrations, to guarantee real time
keyframe_parallax: 10 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.1
gyr_n: 0.01
acc_w: 0.001
gyr_w: 0.0001
g_norm: 9.805       

#unsynchronization parameters
estimate_td: 1
td: -0.05231527425221
                        # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/fast/savedfiles/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
