#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features 
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#frontend degradation handling
frontend_adaptive_feature: 0
frontend_gradient_points: 0
frontend_low_quality: 0.006
frontend_min_quality: 0.002
frontend_degraded_min_dist_ratio: 0.6
frontend_gradient_grid: 32
frontend_gradient_min: 0.000001

#visual degradation / blind inertial MAP parameters
blind_enable: 1
blind_enter_track_num: 8          # enter BLIND if tracked features fall below this
blind_exit_track_num: 45          # leave BLIND only after enough tracks recover
blind_degraded_track_num: 25      # DEGRADED below this; visual residuals are down-weighted
blind_parallax_threshold: 2.0     # px; low parallax keeps the frontend in DEGRADED
blind_visual_weight_degraded: 0.7

#blind bias anchor.  Start conservative and tune from Allan/bag residuals.
blind_bias_acc_sigma: 0.03        # m/s^2
blind_bias_gyr_sigma: 0.002       # rad/s
blind_bias_relax_rate: 0.25       # per second; larger means trust the lock-in bias less over time

#low-dynamic gravity/ZUPT priors.  These only trigger when IMU looks ground-static.
blind_tilt_weight: 1.0
blind_tilt_max_acc_dev: 0.8       # |mean(acc)| must be within this of g
blind_tilt_max_gyr: 0.08          # rad/s, reserved for low-dynamic gating
blind_zupt_weight: 2.0
blind_zupt_max_acc_var: 0.05
blind_zupt_max_gyr: 0.03

#thrust dynamics from px4ctrl /mavros/setpoint_raw/attitude thrust.
blind_thrust_weight: 1.0
blind_thrust_hover_acc: 9.805
blind_thrust_hover_throttle: 0.35
blind_thrust_min_dt: 0.02

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.1          # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.01         # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.001         # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 0.0001       # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.805         # gravity magnitude

#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
td: -0.05                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/fast/savedfiles/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 
